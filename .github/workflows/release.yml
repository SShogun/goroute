name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    name: Publish to NPM (Trusted Publisher OIDC)
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm CLI for OIDC Trusted Publishing support
        run: |
          npm install -g npm@latest
          rm -f ~/.npmrc

      - name: Publish to NPM with Provenance
        run: npm publish --provenance --access public
