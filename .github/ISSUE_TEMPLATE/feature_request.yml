name: 💡 Feature Request
description: Propose a new feature, provider adapter, or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for improving GoRoute!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution
      description: A concise description of what you want to happen.
    validations:
      required: true
