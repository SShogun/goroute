name: 🐛 Bug Report
description: File a bug report to help us improve GoRoute
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug!
  - type: input
    id: version
    attributes:
      label: GoRoute Version
      description: Run `goroute --version`
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or curl commands to reproduce the issue.
    validations:
      required: true
