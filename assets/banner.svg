<svg width="840" height="200" viewBox="0 0 840 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="840" height="200" rx="12" fill="url(#bg-grad)" stroke="#27272a" stroke-width="1" />

  <!-- Subtle Grid Accent -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="840" y2="40" />
    <line x1="0" y1="80" x2="840" y2="80" />
    <line x1="0" y1="120" x2="840" y2="120" />
    <line x1="0" y1="160" x2="840" y2="160" />
    <line x1="140" y1="0" x2="140" y2="200" />
    <line x1="280" y1="0" x2="280" y2="200" />
    <line x1="420" y1="0" x2="420" y2="200" />
    <line x1="560" y1="0" x2="560" y2="200" />
    <line x1="700" y1="0" x2="700" y2="200" />
  </g>

  <!-- Glowing Emblem / Logo Mark -->
  <g transform="translate(68, 52)">
    <!-- Ambient Blue Glow -->
    <circle cx="48" cy="48" r="40" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
    <!-- Outer Shield Hex / Rounded Frame -->
    <rect x="8" y="8" width="80" height="80" rx="20" fill="#18181b" stroke="#3b82f6" stroke-width="2" />
    <!-- Dynamic Lightning / Route Glyph -->
    <path d="M52 22L28 54H48L44 74L68 42H48L52 22Z" fill="url(#bolt-grad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(188, 72)">
    <!-- Wordmark -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Geist', sans-serif" font-weight="700" font-size="44" letter-spacing="-1.2" fill="url(#text-grad)">
      GoRoute
    </text>
    <!-- Version Pill -->
    <rect x="202" y="6" width="62" height="22" rx="11" fill="#18181b" stroke="#3b82f6" stroke-width="1" />
    <text x="233" y="21" font-family="'JetBrains Mono', 'Geist Mono', monospace" font-size="10" font-weight="600" fill="#60a5fa" text-anchor="middle">v0.3.0</text>
    
    <!-- Tagline -->
    <text x="2" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Geist', sans-serif" font-weight="400" font-size="14.5" fill="#a1a1aa" letter-spacing="-0.2">
      Ultra-lightweight local LLM gateway for AI coding agents • <tspan fill="#34d399" font-family="'JetBrains Mono', monospace" font-weight="500">&lt;17MB RAM</tspan>
    </text>
  </g>

  <!-- Mini Stat Badges on Right -->
  <g transform="translate(620, 48)">
    <rect x="0" y="0" width="168" height="32" rx="6" fill="#121215" stroke="#27272a" stroke-width="1" />
    <circle cx="16" cy="16" r="3.5" fill="#10b981" />
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e4e4e7" font-weight="500">Pure Go + Rust</text>

    <rect x="0" y="38" width="168" height="32" rx="6" fill="#121215" stroke="#27272a" stroke-width="1" />
    <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa" font-weight="600">34x lighter</text>
    <text x="88" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#71717a">than Node</text>

    <rect x="0" y="76" width="168" height="32" rx="6" fill="#121215" stroke="#27272a" stroke-width="1" />
    <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#a1a1aa">18 CLI Agents</text>
    <text x="110" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#34d399" font-weight="600">Ready</text>
  </g>
</svg>
